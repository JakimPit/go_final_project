services:
  todo:
    build: .
    ports:
      # хост:контейнер — открываем порт наружу
      - "7540:7540"
    environment:
      TODO_PORT: "7540"
      # БД хранится в volume, а не внутри контейнера — данные не теряются при перезапуске
      TODO_DBFILE: "/data/scheduler.db"
      # Раскомментируй и задай пароль, чтобы включить авторизацию
      # TODO_PASSWORD: "yourpassword"
    volumes:
      # Монтируем папку ./data с хоста в /data контейнера
      # Здесь будет жить scheduler.db — данные сохраняются между перезапусками
      - ./data:/data
