basePath: /
definitions:
  api.tasksResp:
    properties:
      tasks:
        items:
          $ref: '#/definitions/db.Task'
        type: array
    type: object
  db.Task:
    properties:
      comment:
        type: string
      date:
        type: string
      id:
        type: string
      repeat:
        type: string
      title:
        type: string
    type: object
host: localhost:7540
info:
  contact: {}
  description: REST API для управления задачами с поддержкой повторений
  title: Планировщик задач API
  version: "1.0"
paths:
  /api/nextdate:
    get:
      parameters:
      - description: Текущая дата (20060102)
        in: query
        name: now
        required: true
        type: string
      - description: Дата задачи (20060102)
        in: query
        name: date
        required: true
        type: string
      - description: Правило повторения (d N / y / w 1,3 / m 1,15)
        in: query
        name: repeat
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: следующая дата в формате 20060102
          schema:
            type: string
        "400":
          description: ошибка
          schema:
            type: string
      summary: Вычислить следующую дату
      tags:
      - utils
  /api/signin:
    post:
      consumes:
      - application/json
      parameters:
      - description: Пароль
        in: body
        name: credentials
        required: true
        schema:
          properties:
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: JWT-токен
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: неверный пароль
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Авторизация
      tags:
      - auth
  /api/task:
    delete:
      parameters:
      - description: ID задачи
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: пустой объект при успехе
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ошибка
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Удалить задачу
      tags:
      - tasks
    get:
      parameters:
      - description: ID задачи
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Task'
        "400":
          description: ошибка
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить задачу по ID
      tags:
      - tasks
    post:
      consumes:
      - application/json
      parameters:
      - description: Параметры задачи
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/db.Task'
      produces:
      - application/json
      responses:
        "200":
          description: id созданной задачи
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ошибка валидации
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Добавить задачу
      tags:
      - tasks
    put:
      consumes:
      - application/json
      parameters:
      - description: Обновлённые параметры задачи (включая id)
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/db.Task'
      produces:
      - application/json
      responses:
        "200":
          description: пустой объект при успехе
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ошибка валидации
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Обновить задачу
      tags:
      - tasks
  /api/task/done:
    post:
      parameters:
      - description: ID задачи
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: пустой объект при успехе
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ошибка
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Отметить задачу выполненной
      tags:
      - tasks
  /api/tasks:
    get:
      parameters:
      - description: Поиск по тексту или дате (02.01.2006)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.tasksResp'
        "500":
          description: ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Список задач
      tags:
      - tasks
swagger: "2.0"
